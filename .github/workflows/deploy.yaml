# Deploy the site to GitHub Pages: builds the engine plus the three public
# content repos (checked out tokenlessly at build time) and publishes dist/.
name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [portfolio-updated, blog-updated, dotfiles-updated]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Explicit job permissions zero out unspecified scopes, and
      # configure-pages calls the Pages API — pages: read is REQUIRED.
      pages: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7

      - name: Checkout portfolio content
        uses: actions/checkout@v7
        with:
          repository: shmileee/portfolio
          path: content/portfolio

      - name: Checkout blog content
        uses: actions/checkout@v7
        with:
          repository: shmileee/blog
          path: content/blog

      - name: Checkout dotfiles content
        uses: actions/checkout@v7
        with:
          repository: shmileee/dotfiles
          path: content/dotfiles

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Gates run after the build because verify and qa inspect dist/ rather
      # than source, and a design regression should stop the deploy before the
      # artifact is uploaded rather than after it is live.
      - name: Type check
        run: npm run check

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Verify build and design system
        run: npm run verify

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: npm run qa

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

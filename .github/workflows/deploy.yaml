# Deploy the site to GitHub Pages.
#
# Inert until the go-live checklist in README.md is performed (GitHub Actions
# and Pages must be enabled for this repository, and the content repos must
# carry the converted layout). It builds the engine plus the three public
# content repos (checked out tokenlessly at build time) and publishes dist/
# to Pages.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [portfolio-updated, blog-updated, dotfiles-updated]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Explicit job permissions zero out unspecified scopes, and
      # configure-pages calls the Pages API — pages: read is REQUIRED.
      pages: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7

      - name: Checkout portfolio content
        uses: actions/checkout@v7
        with:
          repository: shmileee/portfolio
          path: content/portfolio

      - name: Checkout blog content
        uses: actions/checkout@v7
        with:
          repository: shmileee/blog
          path: content/blog

      - name: Checkout dotfiles content
        uses: actions/checkout@v7
        with:
          repository: shmileee/dotfiles
          path: content/dotfiles

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

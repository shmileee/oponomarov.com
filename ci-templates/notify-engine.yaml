# Template — copy into each content repo as .github/workflows/notify-engine.yaml.
# REPLACE event-type and branch per repo:
#   portfolio -> event-type: portfolio-updated, branches: [main]
#   blog      -> event-type: blog-updated,      branches: [main]
#   dotfiles  -> event-type: dotfiles-updated,  branches: [master]
#
# Requires the ENGINE_DISPATCH_TOKEN secret in the content repo: a fine-grained
# PAT with Contents: write on shmileee/oponomarov.com (never commit real tokens).
name: notify engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rebuild to engine
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
          repository: shmileee/oponomarov.com
          event-type: <repo>-updated
          client-payload: '{"source_repo":"${{ github.repository }}","sha":"${{ github.sha }}"}'
